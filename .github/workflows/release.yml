name: Build Beta Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vnar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      has_notes: ${{ steps.notes.outputs.has_notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Directory.Build.props is the single source of the version; the tag, the
      # installer version and the release title all come from it.
      - name: Read version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content .\Directory.Build.props -Raw)
          $node = $props.SelectSingleNode('//Version')
          if ($null -eq $node -or -not $node.InnerText.Trim()) { throw "Directory.Build.props has no <Version>." }
          $version = $node.InnerText.Trim()
          $title = if ($version -match '^1\.0\.0-beta\.(.+)$') { "VNAR Beta $($Matches[1])" } else { "VNAR $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          Write-Host "Building $title ($version)"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\LocaleGameHub\LocaleGameHub.csproj

      - name: Test Windows taskbar and shortcut identities
        run: dotnet run --project .\tests\VNAR.ShellTests\VNAR.ShellTests.csproj -c Release

      # Storage/recovery, cross-process saves, cover cleanup, decode sizing, scanning,
      # download limits, vnar:// links, version and DPAPI. Uses a temp data folder.
      - name: Test core logic
        run: dotnet run --project .\tests\VNAR.CoreTests\VNAR.CoreTests.csproj -c Release

      - name: Publish self-contained build
        shell: pwsh
        run: |
          dotnet publish .\LocaleGameHub\LocaleGameHub.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o .\dist\portable

          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

          Copy-Item .\LICENSE .\dist\portable\LICENSE.txt
          Copy-Item .\THIRD_PARTY_NOTICES.md .\dist\portable\THIRD_PARTY_NOTICES.md
          Copy-Item .\README.md .\dist\portable\README.md
          Copy-Item .\README.es.md .\dist\portable\README.es.md

          # Debug symbols are not required by end users (Skia's PDB is large).
          Get-ChildItem .\dist\portable -Recurse -Filter *.pdb | Remove-Item

      - name: Include dependency licenses
        shell: pwsh
        run: |
          $noticeRoot = New-Item .\dist\portable\licenses -ItemType Directory -Force
          $dotnetNotices = New-Item (Join-Path $noticeRoot.FullName 'dotnet') -ItemType Directory -Force
          Get-ChildItem $env:DOTNET_ROOT -File |
            Where-Object { $_.Name -match '(?i)license|notice' } |
            Copy-Item -Destination $dotnetNotices.FullName

          $assets = Get-Content .\LocaleGameHub\obj\project.assets.json -Raw | ConvertFrom-Json
          foreach ($packageRoot in $assets.packageFolders.PSObject.Properties.Name) {
            foreach ($package in (Get-ChildItem $packageRoot -Directory | Where-Object { $_.Name -like 'skiasharp*' -or $_.Name -like 'microsoft.netcore.app.runtime.*' -or $_.Name -like 'microsoft.windowsdesktop.app.runtime.*' })) {
              foreach ($notice in (Get-ChildItem $package.FullName -Recurse -File | Where-Object { $_.Name -match '(?i)license|notice' -and $_.Extension -in '.txt', '.md', '.html', '' })) {
                $relative = [IO.Path]::GetRelativePath($packageRoot, $notice.FullName)
                $target = Join-Path $noticeRoot.FullName $relative
                New-Item (Split-Path $target -Parent) -ItemType Directory -Force | Out-Null
                Copy-Item $notice.FullName $target
              }
            }
          }
          if (!(Get-ChildItem $dotnetNotices.FullName -File)) { throw 'Missing .NET license notices' }
          Get-ChildItem $noticeRoot.FullName -Recurse -File | Select-Object FullName

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path .\dist\portable\* -DestinationPath .\dist\VNAR-Portable-win-x64.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.version }}" .\installer\VNAR.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Verify packages and create checksums
        shell: pwsh
        run: |
          foreach ($file in @('.\dist\portable\VNAR.exe', '.\dist\portable\Resources\VNARShortcut.ico', '.\dist\VNAR-Setup.exe', '.\dist\VNAR-Portable-win-x64.zip')) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing or empty package file: $file" }
          }
          Get-FileHash .\dist\VNAR-Setup.exe, .\dist\VNAR-Portable-win-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content .\dist\SHA256SUMS.txt -Encoding ascii

      # Release notes = the "## <version>" section of CHANGELOG.md + download info.
      # A missing section only fails the job that would publish a new release.
      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $title = '${{ steps.version.outputs.title }}'
          $lines = Get-Content .\CHANGELOG.md -Encoding utf8
          $section = New-Object System.Collections.Generic.List[string]
          $inside = $false
          foreach ($line in $lines) {
            if ($line.Trim() -eq "## $version") { $inside = $true; continue }
            if ($inside -and $line -match '^## ') { break }
            if ($inside) { $section.Add($line) }
          }
          $body = ($section -join "`n").Trim()
          $hasNotes = if ($body) { 'true' } else { 'false' }
          "has_notes=$hasNotes" >> $env:GITHUB_OUTPUT

          $downloads = @"
          ### Downloads
          - **VNAR-Setup.exe** — self-contained Windows installer.
          - **VNAR-Portable-win-x64.zip** — self-contained portable build.
          - **SHA256SUMS.txt** — package checksums.

          Both packages store settings and artwork in ``%LOCALAPPDATA%\VNAR``.
          The executables are unsigned; Windows may display a SmartScreen warning.

          See the repository README for setup instructions, features, and third-party notices.
          "@

          Set-Content .\dist\release-notes.md -Value "## $title`n`n$body`n`n$downloads" -Encoding utf8
          Get-Content .\dist\release-notes.md

      - name: Upload validated packages
        uses: actions/upload-artifact@v4
        with:
          name: vnar-windows-packages
          path: |
            dist/VNAR-Setup.exe
            dist/VNAR-Portable-win-x64.zip
            dist/SHA256SUMS.txt
            dist/release-notes.md
          if-no-files-found: error

  publish-release:
    needs: build-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: vnar-windows-packages
          path: dist

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = '${{ needs.build-release.outputs.tag }}'
          $title = '${{ needs.build-release.outputs.title }}'
          $version = '${{ needs.build-release.outputs.version }}'

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            if ('${{ needs.build-release.outputs.has_notes }}' -ne 'true') {
              throw "CHANGELOG.md has no '## $version' section. Add the release notes there before publishing $tag."
            }
            gh release create $tag `
              .\dist\VNAR-Setup.exe `
              .\dist\VNAR-Portable-win-x64.zip `
              .\dist\SHA256SUMS.txt `
              --title $title `
              --notes-file .\dist\release-notes.md `
              --prerelease --draft `
              --target "${{ github.sha }}"
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }
            gh release edit $tag --draft=false
            if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
          } else {
            Write-Host "Release $tag already exists; keeping its original packages. Bump <Version> in Directory.Build.props for the next release."
          }
